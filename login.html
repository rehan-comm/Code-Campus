<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login/Signup - CodeCampus" />
    <meta name="author" content="CodeCampus" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>Login / Signup - Code Campus</title>
</head>

<body style="margin: 0; padding: 0;">
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <img src="logo.png" alt="CodeCampus Logo" class="auth-logo">

                <!-- Login Form -->
                <div class="auth-form login-form" id="loginForm">
                    <h2>Welcome Back</h2>
                    <p>Login to continue your learning journey</p>

                    <input type="email" id="loginEmail" placeholder="Email address" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>

                    <button class="auth-btn" onclick="handleLogin()"><i class="ri-login-box-line"></i> Login</button>

                    <p class="auth-toggle">Don't have an account? <a href="#" onclick="switchToSignup()">Sign Up</a></p>
                </div>

                <!-- Signup Form -->
                <div class="auth-form signup-form hidden" id="signupForm">
                    <h2>Create Account</h2>
                    <p>Join our learning community today</p>

                    <input type="text" id="signupName" placeholder="Full Name" required>
                    <input type="email" id="signupEmail" placeholder="Email address" required>
                    <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required>
                    <input type="password" id="signupConfirm" placeholder="Confirm Password" required>

                    <div class="image-upload">
                        <label for="profileImage" class="image-label">
                            <i class="ri-image-add-line"></i> Upload Profile Picture
                        </label>
                        <input type="file" id="profileImage" accept="image/*" style="display: none;">
                        <img id="imagePreview" src="" alt="Preview"
                            style="display: none; width: 60px; height: 60px; border-radius: 50%; margin-top: 10px;">
                    </div>

                    <button class="auth-btn" onclick="handleSignup()"><i class="ri-user-add-line"></i> Create
                        Account</button>

                    <p class="auth-toggle">Already have an account? <a href="#" onclick="switchToLogin()">Login</a></p>
                </div>

                <div id="authMessage" class="auth-message"></div>
            </div>
        </div>
    </div>

    <script>
        // Image preview
        document.getElementById('profileImage')?.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    document.getElementById('imagePreview').src = event.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                    window.selectedImage = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function switchToSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            clearMessages();
        }

        function switchToLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            clearMessages();
        }

        function clearMessages() {
            document.getElementById('authMessage').textContent = '';
            document.getElementById('authMessage').className = 'auth-message';
        }

        function showMessage(msg, type) {
            const messageEl = document.getElementById('authMessage');
            messageEl.textContent = msg;
            messageEl.className = 'auth-message' + (type === 'error' ? ' error' : ' success');
        }

        function handleLogin() {
            try {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    showMessage('Please fill in all fields', 'error');
                    return;
                }

                const users = JSON.parse(localStorage.getItem('users') || '[]') || [];
                if (!Array.isArray(users)) {
                    console.error('Users data is not an array');
                    localStorage.setItem('users', '[]');
                }

                const user = (Array.isArray(users) ? users : []).find(u => u.email === email && u.password === password);

                if (user) {
                    // Add login timestamp for session management
                    user.loginTime = Date.now();
                    user.lastVisit = Date.now(); // Initialize sliding session
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    showMessage('Login successful! Redirecting...', 'success');

                    // Check for return URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const returnUrl = urlParams.get('returnUrl');

                    setTimeout(() => {
                        window.location.href = returnUrl ? decodeURIComponent(returnUrl) : 'index.html';
                    }, 1500);
                } else {
                    showMessage('Invalid email or password', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('An error occurred during login. Please try again.', 'error');
            }
        }

        function handleSignup() {
            try {
                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const password = document.getElementById('signupPassword').value;
                const confirm = document.getElementById('signupConfirm').value;
                const image = window.selectedImage || 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop';

                if (!name || !email || !password || !confirm) {
                    showMessage('Please fill in all fields', 'error');
                    return;
                }

                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters', 'error');
                    return;
                }

                if (password !== confirm) {
                    showMessage('Passwords do not match', 'error');
                    return;
                }

                let users = JSON.parse(localStorage.getItem('users') || '[]') || [];
                if (!Array.isArray(users)) {
                    users = [];
                }

                if (users.find(u => u.email === email)) {
                    showMessage('Email already registered', 'error');
                    return;
                }

                const newUser = {
                    id: Date.now(),
                    name,
                    email,
                    password,
                    image,
                    enrolledCourses: [],
                    loginTime: Date.now(),
                    lastVisit: Date.now()
                };

                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));

                showMessage('Account created! Redirecting...', 'success');

                // Check for return URL
                const urlParams = new URLSearchParams(window.location.search);
                const returnUrl = urlParams.get('returnUrl');

                setTimeout(() => {
                    window.location.href = returnUrl ? decodeURIComponent(returnUrl) : 'index.html';
                }, 1500);
            } catch (error) {
                console.error('Signup error:', error);
                if (error.name === 'QuotaExceededError') {
                    showMessage('Storage full! Try a smaller profile picture.', 'error');
                } else {
                    showMessage('An error occurred. Please try again.', 'error');
                }
            }
        }
    </script>
</body>

</html>
